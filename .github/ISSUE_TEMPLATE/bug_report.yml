name: 🐛 Bug report
description: Something in HookBox doesn't work as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please **don't include real secrets or customer data** in captured payloads you paste here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command you ran and the request you sent (a curl command is perfect).
      placeholder: |
        1. npx github:reseachrandomv/hookbox --target http://localhost:3000/hook
        2. curl -X POST http://localhost:4040/wh/test -d '{"a":1}'
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HookBox version / commit
      placeholder: "0.1.0 (hookbox --version) or commit SHA"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "node --version"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, WSL, Other]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [Capture, Dashboard UI, Replay / --target, Signature verification, Code export, Tunnel, SQLite / --db, CLI, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or browser console output
      render: shell
